name: Deploy to Minikube

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted  # Your local Windows machine
    env:
      KUBECONFIG: C:\\Users\\surab\\.kube\\config

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Minikube (must already be running)
      run: |
        echo "Assuming Minikube is running and KUBECONFIG is correctly set"

    - name: Deploy to Kubernetes (Minikube)
      run: |
        kubectl apply -f k8s/flask-app-20 -n argocd
        kubectl rollout status deployment/flask-app-v20 -n argocd --timeout=60s
